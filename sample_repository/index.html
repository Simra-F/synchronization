<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskbox</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/themes.css">
</head>
<body>
  <main>
    <header>
      <img src="assets/logo.svg" alt="" width="40" height="40">
      <div>
        <h1 id="site-title">Taskbox</h1>
        <p id="tagline">A tiny task list that lives in your browser.</p>
      </div>
    </header>
    <div class="row">
      <input id="new-task" placeholder="What needs doing?" autocomplete="off">
      <div id="toolbar"></div>
    </div>
    <div id="filters"></div>
    <ul id="task-list"></ul>
    <p id="remaining"></p>
  </main>
  <footer>Last change: <span id="last-change">initial version</span></footer>
  <script src="src/utils/format.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/filters.js"></script>
  <script src="src/theme.js"></script>
  <script src="src/components/taskList.js"></script>
  <script src="src/components/toolbar.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
